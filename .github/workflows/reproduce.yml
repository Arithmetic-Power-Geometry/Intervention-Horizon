name: One-click reproduce
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: python -c "import app; assert app.demo is not None"
      - run: python -m intervention_horizon.benchmark --out results --n 50000
      - uses: actions/upload-artifact@v4
        with:
          name: intervention-horizon-results
          path: results/

[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="intervention-horizon"
version="2.1.0"
description="Reference implementation, experiments, and interactive lab for Intervention Horizon theory"
requires-python=">=3.10"
dependencies=["numpy>=1.26","pandas>=2.0","matplotlib>=3.8","gradio>=6.0"]

[project.optional-dependencies]
dev=["pytest>=8"]

[tool.setuptools.packages.find]
where=["src"]
